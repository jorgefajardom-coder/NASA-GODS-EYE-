name: ci

on:
  push:
  pull_request:

jobs:
  build-and-contract:
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: apt-get update && apt-get install -y python3-pytest python3-yaml
      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build
      - name: Contract tests
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 -m pytest tests/contract
