name: Scaffold checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_repository.py
      - run: python -m pytest
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  ros:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools and declared ROS dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-rosdep python3-pytest python3-jsonschema
          rosdep update --rosdistro jazzy
          rosdep install --from-paths src --ignore-src --rosdistro jazzy -r -y
      - name: Build and inspect all custom interfaces
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install
          source install/setup.bash
          for name in TerrainMeta TerrainObservation AgentState MissionEvent MissionState RouteDecision; do
            ros2 interface show mge_interfaces/msg/$name
          done
          ros2 interface show mge_interfaces/srv/PlanRoute
          ros2 interface show mge_interfaces/srv/SetMissionGoal
          python3 -m pytest tests/contract -q
          # Other unit/HTTP tests live in root tests/ and run in the Python job.
          # No package-local test suites exist yet; colcon test would run none.
